<style>
  :root {
    --bg: #000000;          /* hitam murni = piksel OLED mati */
    --surface: #0b0b0b;
    --line: #232323;
    --text: #f5efe0;        /* krem, warna outline stiker logo */
    --muted: #8d8880;
    --chili: #ee3a2d;
    --orange: #f28a1e;
    --wa: #25d366;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: max(32px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 440px; }

  /* ---------- kepala: logo ---------- */
  header { text-align: center; padding-top: 8px; }
  .logo-wrap {
    position: relative;
    width: 188px;
    margin: 0 auto 22px;
  }
  .logo-wrap::before {            /* cahaya merah tipis di belakang logo */
    content: "";
    position: absolute;
    inset: 14% 4% 4%;
    background: radial-gradient(closest-side, rgba(238,58,45,.30), rgba(238,58,45,0));
    filter: blur(22px);
    z-index: 0;
  }
  .logo {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: auto;
    animation: logo-in .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes logo-in {
    from { opacity: 0; transform: translateY(10px) scale(.94) rotate(-3deg); }
    to   { opacity: 1; transform: none; }
  }
  h1 {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.1;
  }
  .intro {
    margin: 10px auto 0;
    max-width: 30ch;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.45;
  }

  /* ---------- tombol WhatsApp ---------- */
  .wa {
    margin-top: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 18px 20px;
    border-radius: 18px;
    background: var(--wa);
    color: #000;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 800;
    text-decoration: none;
    transition: transform .12s ease, filter .12s ease;
  }
  .wa svg { width: 26px; height: 26px; flex: none; }
  .wa:active { transform: scale(.98); filter: brightness(.92); }

  /* ---------- daftar lokasi ---------- */
  h2 {
    margin: 38px 4px 12px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
  }
  .places { list-style: none; padding: 0; display: grid; gap: 10px; }
  .place {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s ease, transform .12s ease;
  }
  .place:hover { border-color: var(--chili); }
  .place:active { transform: scale(.985); }
  .pin {
    flex: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--chili);
  }
  .pin svg { width: 22px; height: 22px; fill: #fff; }
  .place-text { min-width: 0; flex: 1; }
  .place-name { font-weight: 600; font-size: 1.05rem; line-height: 1.2; }
  .place-addr {
    margin-top: 3px;
    color: var(--muted);
    font-size: .9rem;
    line-height: 1.35;
  }
  .chev { flex: none; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
    .wa, .place { transition: none; }
  }
</style>
</head>

<script>
/* =====================================================
   EDIT DI SINI SAJA
   ===================================================== */
const CONFIG = {
  brand: "MAO Group",
  intro: "Pesan lewat WhatsApp atau mampir ke outlet.",

  whatsapp: {
    number: "6283823530754",   // GANTI: nomor WA, format 62 tanpa 0 / +
    message: "Halo MAO, aku mau pesan.",   // teks awal chat (boleh dikosongkan)
    label: "Pesan lewat WhatsApp"
  },

  placesTitle: "Lokasi outlet",

  // Isi 1 sampai 4 lokasi. Hapus blok yang tidak dipakai.
  places: [
    {
      name: "Outlet 1",
      address: "Wonton dan Mie Jebew Cabang Sukadana",
      url: "https://maps.app.goo.gl/PgdsXcGac4YvS7rLA"  // GANTI: link Google Maps
    },
    {
      name: "Outlet 2",
      address: "Wonton dan Mie Jebew Cabang Leweung Gajah",
      url: "https://maps.app.goo.gl/RFqHFkaCnXbDzZGg6"  // GANTI: link Google Maps
    },
    {
      name: "Outlet 3",
      address: "Wonton dan Cirawang Cabang Babakan",
      url: "https://maps.app.goo.gl/gvjEWqt6W1DTx8Jn6"  // GANTI: link Google Maps
    },
    {
      name: "Outlet 4",
      address: "Mie Time Sukadana",
      url: "https://maps.app.goo.gl/bHUw6wV8UChpDgZU6"  // GANTI: link Google Maps
    }
    // Tambah lagi (maks. 4):
    // { name: "Outlet 3", address: "Alamat", url: "https://maps.app.goo.gl/xxxx" },
  ]
};
/* ===================================================== */

const $ = (id) => document.getElementById(id);

$("brand").textContent = CONFIG.brand;
$("intro").textContent = CONFIG.intro;
$("wa-label").textContent = CONFIG.whatsapp.label;
$("places-title").textContent = CONFIG.placesTitle;

const waText = CONFIG.whatsapp.message
  ? "?text=" + encodeURIComponent(CONFIG.whatsapp.message)
  : "";
$("wa").href = "https://wa.me/" + CONFIG.whatsapp.number + waText;

const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

const list = $("places");
CONFIG.places.slice(0, 4).forEach((p) => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "place";
  a.href = p.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.setAttribute("aria-label", "Buka " + p.name + " di Google Maps");
  a.innerHTML =
    '<span class="pin">' + PIN + '</span>' +
    '<span class="place-text"><span class="place-name"></span>' +
    '<span class="place-addr" style="display:block"></span></span>' + CHEV;
  a.querySelector(".place-name").textContent = p.name;
  a.querySelector(".place-addr").textContent = p.address;
  li.appendChild(a);
  list.appendChild(li);
});
</script>
