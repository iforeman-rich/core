<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Interaktif</title>
<style>
  :root {
    --bg: #0b0b0f;
    --card: #14141b;
    --border: #23232e;
    --text: #e8e8ee;
    --muted: #8a8a9a;
    --accent: #c9a96e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 48px 20px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin-top: 6px; }
  .search {
    width: 100%; margin: 28px 0 20px; padding: 12px 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 1rem; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  a.card {
    display: block; padding: 18px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px;
    text-decoration: none; color: inherit;
    transition: transform .15s, border-color .15s;
  }
  a.card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card .name { font-weight: 600; font-size: 1.05rem; }
  .card .path { color: var(--muted); font-size: .8rem; margin-top: 6px; word-break: break-all; }
  .card .go { color: var(--accent); font-size: .85rem; margin-top: 12px; }
  .msg { color: var(--muted); padding: 24px 0; line-height: 1.6; }
  .msg code { background: var(--card); padding: 2px 6px; border-radius: 4px; color: var(--text); }
  .count { color: var(--muted); font-size: .85rem; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Web Interaktif</h1>
  <p class="sub">Daftar halaman otomatis terbaca dari folder di repo.</p>
  <input id="q" class="search" type="search" placeholder="Cari halaman...">
  <div id="count" class="count"></div>
  <div id="list" class="grid"></div>
  <div id="msg" class="msg">Memuat daftar...</div>
</div>

<script>
/* ---------- KONFIGURASI (opsional) ----------
   Biasanya kosong saja, otomatis terdeteksi dari URL github.io.
   Isi manual kalau pakai custom domain atau mau tes di lokal. */
const CONFIG = {
  owner: "",   // contoh: "rofi"
  repo:  "",   // contoh: "belajar-web"
  folder: "Web-interaktif",  // nama folder induk di repo
  hide: []     // nama subfolder yang mau disembunyikan, contoh: ["draft"]
};

function detectRepo() {
  let { owner, repo } = CONFIG;
  if (owner && repo) return { owner, repo };
  const host = location.hostname;
  if (host.endsWith(".github.io")) {
    owner = host.split(".")[0];
    const parts = location.pathname.split("/").filter(Boolean);
    // https://user.github.io/REPO/Web-interaktif/  -> repo = parts[0]
    // https://user.github.io/Web-interaktif/       -> repo = user.github.io
    repo = (parts[0] && parts[0] !== CONFIG.folder) ? parts[0] : host;
    return { owner, repo };
  }
  return null;
}

const listEl = document.getElementById("list");
const msgEl = document.getElementById("msg");
const countEl = document.getElementById("count");
const qEl = document.getElementById("q");
let items = [];

function pretty(name) {
  return decodeURIComponent(name).replace(/[-_]+/g, " ");
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const shown = items.filter(n => pretty(n).toLowerCase().includes(q));
  listEl.innerHTML = "";
  shown.forEach(n => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "./" + encodeURIComponent(n) + "/";
    a.innerHTML = `<div class="name"></div><div class="path"></div><div class="go">Buka →</div>`;
    a.querySelector(".name").textContent = pretty(n);
    a.querySelector(".path").textContent = n + "/";
    listEl.appendChild(a);
  });
  countEl.textContent = items.length ? `${shown.length} dari ${items.length} halaman` : "";
  msgEl.style.display = shown.length ? "none" : "block";
  if (!shown.length && items.length) msgEl.textContent = "Tidak ada yang cocok.";
}

async function load() {
  const info = detectRepo();
  if (!info) {
    msgEl.innerHTML = "Tidak bisa mendeteksi repo (bukan di <code>github.io</code>). Isi <code>CONFIG.owner</code> dan <code>CONFIG.repo</code> di bagian atas script.";
    return;
  }
  try {
    const url = `https://api.github.com/repos/${info.owner}/${info.repo}/git/trees/HEAD?recursive=1`;
    const res = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error("GitHub API " + res.status);
    const data = await res.json();
    const prefix = CONFIG.folder + "/";
    const found = new Set();
    data.tree.forEach(t => {
      if (t.type !== "blob" || !t.path.startsWith(prefix)) return;
      const rest = t.path.slice(prefix.length).split("/");
      // hanya subfolder yang punya index.html langsung di dalamnya
      if (rest.length === 2 && rest[1].toLowerCase() === "index.html") found.add(rest[0]);
    });
    items = [...found].filter(n => !CONFIG.hide.includes(n)).sort((a, b) => a.localeCompare(b));
    if (!items.length) {
      msgEl.textContent = "Belum ada folder yang berisi index.html.";
      return;
    }
    render();
  } catch (e) {
    msgEl.textContent = "Gagal memuat daftar: " + e.message + " (kalau 403, kemungkinan kena limit API GitHub, coba lagi nanti.)";
  }
}

qEl.addEventListener("input", render);
load();
</script>
</body>
</html>
