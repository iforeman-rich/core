<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Interaktif</title>
<style>
  :root { --bg:#0b0b0f; --card:#14141b; --border:#23232e; --text:#e8e8ee; --muted:#8a8a9a; --accent:#c9a96e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; padding: 48px 20px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin-top: 6px; }
  .search { width: 100%; margin: 28px 0 20px; padding: 12px 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 1rem; outline: none; }
  .search:focus { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  a.card { display: block; padding: 18px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
  a.card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card .name { font-weight: 600; font-size: 1.05rem; }
  .card .go { color: var(--accent); font-size: .85rem; margin-top: 12px; }
  .msg { color: var(--muted); padding: 24px 0; display: none; }
  .count { color: var(--muted); font-size: .85rem; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Web Interaktif</h1>
  <p class="sub">Kumpulan halaman interaktif.</p>
  <input id="q" class="search" type="search" placeholder="Cari halaman...">
  <div id="count" class="count">7 halaman</div>
  <div id="list" class="grid">
    <a class="card" href="https://iforeman-rich.github.io/core/Web-interaktif/Benih-berkualitas/" data-title="benih berkualitas">
      <div class="name">Benih Berkualitas</div>
      <div class="go">Buka &rarr;</div>
    </a>
    <a class="card" href="https://iforeman-rich.github.io/core/Web-interaktif/Berubah-tidak-sendirian/" data-title="berubah tidak sendirian">
      <div class="name">Berubah Tidak Sendirian</div>
      <div class="go">Buka &rarr;</div>
    </a>
    <a class="card" href="https://iforeman-rich.github.io/core/Web-interaktif/Jalan-seorang-pecinta/" data-title="jalan seorang pecinta">
      <div class="name">Jalan Seorang Pecinta</div>
      <div class="go">Buka &rarr;</div>
    </a>
    <a class="card" href="https://iforeman-rich.github.io/core/Web-interaktif/Jebakan-aturan-main/" data-title="jebakan aturan main">
      <div class="name">Jebakan Aturan Main</div>
      <div class="go">Buka &rarr;</div>
    </a>
    <a class="card" href="https://iforeman-rich.github.io/core/Web-interaktif/Makna-dekat/" data-title="makna dekat">
      <div class="name">Makna Dekat</div>
      <div class="go">Buka &rarr;</div>
    </a>
    <a class="card" href="https://iforeman-rich.github.io/core/Web-interaktif/Pembawa-dan-hakim/" data-title="pembawa dan hakim">
      <div class="name">Pembawa Dan Hakim</div>
      <div class="go">Buka &rarr;</div>
    </a>
    <a class="card" href="https://iforeman-rich.github.io/core/Web-interaktif/Penjual-jamu-yang-menunda/" data-title="penjual jamu yang menunda">
      <div class="name">Penjual Jamu Yang Menunda</div>
      <div class="go">Buka &rarr;</div>
    </a>
  </div>
  <div id="msg" class="msg">Tidak ada yang cocok.</div>
</div>
<script>
const q = document.getElementById("q");
const cards = [...document.querySelectorAll("a.card")];
const count = document.getElementById("count");
const msg = document.getElementById("msg");
q.addEventListener("input", () => {
  const t = q.value.trim().toLowerCase();
  let n = 0;
  cards.forEach(c => {
    const ok = c.dataset.title.includes(t);
    c.style.display = ok ? "" : "none";
    if (ok) n++;
  });
  count.textContent = n + " dari " + cards.length + " halaman";
  msg.style.display = n ? "none" : "block";
});
</script>
</body>
</html>
